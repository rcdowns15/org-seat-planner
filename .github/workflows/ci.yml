name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main should finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # stop a hung job instead of waiting for the 6-hour default
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Database-backed tests and Playwright, against a Postgres 16 service container.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # stop a hung job instead of waiting for the 6-hour default
    env:
      # The localhost Docker Compose defaults (same as .env.example): not secrets.
      DATABASE_URL: postgres://seatplanner:seatplanner@localhost:5432/seatplanner
      DATABASE_URL_UNPOOLED: postgres://seatplanner:seatplanner@localhost:5432/seatplanner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatplanner
          POSTGRES_PASSWORD: seatplanner
          POSTGRES_DB: seatplanner
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U seatplanner -d seatplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:db
      # The SQL panel's analytics presets (sql-panel.spec.ts) read the dbt marts, so build them:
      # `pnpm run pipeline` ingests both reports, runs dbt build and prints the summary (LR-03-05).
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: analytics/.python-version
      - run: uv sync --frozen
        working-directory: analytics
      - run: uv run dbt deps
        working-directory: analytics
      - run: pnpm run pipeline
        env:
          # The localhost Docker Compose defaults (same as .env.example): not secrets.
          DBT_HOST: localhost
          DBT_PORT: "5432"
          DBT_USER: seatplanner
          DBT_PASSWORD: seatplanner
          DBT_DBNAME: seatplanner
      - run: pnpm exec playwright install --with-deps chromium
      # Build as its own step so a build failure is a named failing step, not a webServer timeout.
      - run: pnpm build
      # The conflict spec uses the demo-only "simulate another leader's edit" (D-023).
      - run: pnpm test:e2e
        env:
          DEMO_MODE: "true"
      - uses: actions/upload-artifact@v4
        if: failure() # only upload when something failed
        with:
          name: playwright-report
          # HTML report plus traces and screenshots from failed tests.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # dbt: build and test all models against a freshly migrated and seeded Postgres 16.
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # stop a hung job instead of waiting for the 6-hour default
    env:
      # The localhost Docker Compose defaults (same as .env.example): not secrets.
      DATABASE_URL: postgres://seatplanner:seatplanner@localhost:5432/seatplanner
      DATABASE_URL_UNPOOLED: postgres://seatplanner:seatplanner@localhost:5432/seatplanner
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: seatplanner
      DBT_PASSWORD: seatplanner
      DBT_DBNAME: seatplanner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatplanner
          POSTGRES_PASSWORD: seatplanner
          POSTGRES_DB: seatplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatplanner -d seatplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # The seed loads the 11-01 report; the refresh-changes and reconciliation tests need 11-15 too.
      - run: pnpm workday:ingest data/workday/worker_report_2026-11-15.csv
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: analytics/.python-version
      - run: uv sync --frozen
        working-directory: analytics
      - run: uv run dbt deps
        working-directory: analytics
      - run: uv run dbt build
        working-directory: analytics
      # These two are warn-level so a used local database still builds. On this freshly seeded
      # database a warning means the 11-15 report didn't load or the seed-list tests skipped, so
      # --warn-error turns it into a failure.
      - run: uv run dbt --warn-error test --select assert_next_report_is_loaded assert_seed_list_tests_are_active
        working-directory: analytics
