version: 2

models:
  - name: dim_squads
    description: One row per squad with its group and division. The org hierarchy the marts group by.
    columns:
      - name: squad_id
        description: Squad; one row per squad.
        data_tests: [unique, not_null]
      - name: squad_name
        description: Squad name, unique within its group.
        data_tests: [not_null]
      - name: group_id
        description: The group the squad belongs to.
        data_tests: [not_null]
      - name: group_name
        description: Group name.
        data_tests: [not_null]
      - name: division_id
        description: The division the group belongs to.
        data_tests: [not_null]
      - name: division_name
        description: Division name.
        data_tests: [not_null]

  - name: dim_people
    description: >
      One row per worker ever seen in an ingested Workday report: the worker's row from the latest
      report they appear in, plus the seat they hold now in the leaders' plan. A worker missing
      from the newest report keeps their last known row and has `is_in_latest_report = false`.
      Workers who hold a seat in the plan but appear in no report are absent (the model starts
      from reports); a reconciliation model has to find those.
    columns:
      - name: worker_id
        description: Worker ID; one row per worker.
        data_tests: [unique, not_null]
      - name: last_seen_report_date
        description: Date of the newest report that lists the worker.
        data_tests: [not_null]
      - name: is_in_latest_report
        description: True when the worker is in the newest report.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: first_name
        description: First name.
      - name: last_name
        description: Last name.
      - name: work_email
        description: Work email.
      - name: worker_type
        description: Worker type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["employee", "contingent"]
      - name: worker_status
        description: Worker status in Workday.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["active", "leave", "terminated"]
      - name: hire_date
        description: Hire date; can be in the future.
      - name: termination_date
        description: Termination date; null unless terminated.
      - name: contract_end_date
        description: Contract end date; contingent workers only.
      - name: manager_id
        description: Manager's worker ID.
      - name: job_title
        description: Job title.
      - name: supervisory_organization
        description: Supervisory organization as written in the report.
      - name: position_id
        description: Workday position ID. Seats are not linked to positions (D-029).
      - name: cost_center
        description: Cost center, code and name together.
      - name: location
        description: Work location.
      - name: current_seat_id
        description: Seat assigned in the leaders' plan in `app.seats` (includes moves saved but not yet effective, D-012); null if none.
        data_tests:
          - unique
      - name: current_squad_id
        description: Squad of that seat; null if none.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_squads')
                field: squad_id
      - name: current_seat_type
        description: Type of that seat; null if none.
        data_tests:
          - accepted_values:
              arguments:
                values: ["employee", "contingent"]
      - name: holds_seat
        description: True when the worker holds a seat now.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: rpt_squad_headcount
    description: >
      Squad headcount against the approved plan, one row per squad per report date. Seat counts are
      as of each report date, rebuilt from the audit log (`int_seat_state_as_of`, D-036), so moves
      effective after a report date are not counted in that date's row.
      The plan is the squad's approved seats for the quarter containing the report date.
      Committed seats = filled employee + filled contingent + offer accepted seats.
      Variance = committed seats minus approved seats: zero means exactly on plan, negative means
      room left under plan, positive means over plan (the `squad_not_over_plan` test fails on it).
      Fill rate = filled seats (employee + contingent) divided by approved seats, as a fraction
      rounded to 4 decimals (0.95 is 95%); null when approved seats is zero. Open, backfill and
      offer accepted seats are not filled, so they lower the fill rate.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [squad_id, report_date]
    columns:
      - name: squad_id
        description: The squad.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_squads')
                field: squad_id
      - name: report_date
        description: Workday report date the row is stamped with.
        data_tests: [not_null]
      - name: is_latest_report
        description: True for the newest ingested report date. It marks which row is newest, not that the counts equal today's live seats.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: plan_quarter_start
        description: First day of the quarter containing the report date; the plan quarter used.
        data_tests: [not_null]
      - name: filled_employee_seats
        description: Employee seats with status `filled`.
        data_tests: [not_null]
      - name: filled_contingent_seats
        description: Contingent seats with status `filled`.
        data_tests: [not_null]
      - name: open_seats
        description: Seats with status `open`.
        data_tests: [not_null]
      - name: backfill_seats
        description: Seats with status `backfill` (approved seats to refill).
        data_tests: [not_null]
      - name: offer_accepted_seats
        description: Seats with status `offer_accepted` (reserved for an incoming hire).
        data_tests: [not_null]
      - name: approved_seats
        description: Approved seats for the squad in the plan quarter.
        data_tests: [not_null]
      - name: variance
        description: Committed seats (filled + offer accepted) minus approved seats. Positive is over plan.
        data_tests: [not_null]
      - name: fill_rate
        description: Filled seats divided by approved seats, as a fraction from 0 to 1; null when approved seats is zero.

  - name: rpt_workday_changes
    description: >
      What changed for each worker between consecutive Workday reports, one row per worker per
      report date; workers with no change have no row, and the first report has none. Change
      types: `hire` (new, already started), `future_hire` (new, hire date after the report date),
      `termination`, `worker_type_change`, `leave_start`, `leave_end`, `status_change` (any other
      status move, such as a rehire), `manager_change`, `aged_out` (a terminated worker who
      dropped off because their termination date is before the report's termination window; not
      an exception) and `missing` (dropped off although the window says they should still be in
      the report: either no termination on record, or terminated with a date inside this
      report's window). A `missing` worker is an exception in `rpt_reconciliation_exceptions`
      when they hold a seat (`seated_missing_from_report`) or were active or on leave in the
      previous report (`missing_without_termination`). The termination window is the report date minus 29 days
      through the report date (`workday_termination_window_days` = 30), the rule the mock reports
      follow. A row has one change type, the first that applies in that order; the `previous_*`
      and current columns show every attribute that moved.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [worker_id, report_date]
    columns:
      - name: worker_id
        description: Worker ID.
        data_tests: [not_null]
      - name: report_date
        description: The report in which the change shows up.
        data_tests: [not_null]
      - name: previous_report_date
        description: The report it is compared with.
        data_tests: [not_null]
      - name: change_type
        description: What changed (see the model description).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "hire",
                    "future_hire",
                    "termination",
                    "worker_type_change",
                    "leave_start",
                    "leave_end",
                    "status_change",
                    "manager_change",
                    "aged_out",
                    "missing",
                  ]
      - name: previous_worker_status
        description: Status in the previous report; null for a hire.
        data_tests:
          - accepted_values:
              arguments:
                values: ["active", "leave", "terminated"]
      - name: worker_status
        description: Status in this report; null when the worker dropped off.
        data_tests:
          - accepted_values:
              arguments:
                values: ["active", "leave", "terminated"]
      - name: previous_worker_type
        description: Worker type in the previous report; null for a hire.
        data_tests:
          - accepted_values:
              arguments:
                values: ["employee", "contingent"]
      - name: worker_type
        description: Worker type in this report; null when the worker dropped off.
        data_tests:
          - accepted_values:
              arguments:
                values: ["employee", "contingent"]
      - name: previous_manager_id
        description: Manager's worker ID in the previous report.
      - name: manager_id
        description: Manager's worker ID in this report.
      - name: previous_supervisory_organization
        description: Supervisory organization in the previous report.
      - name: supervisory_organization
        description: Supervisory organization in this report.
      - name: hire_date
        description: Hire date in this report; null when the worker dropped off.
      - name: termination_date
        description: Termination date in this report, or in the previous report when the worker dropped off.
      - name: termination_window_start
        description: First day of this report's termination window (report date minus 29 days).
        data_tests: [not_null]

  - name: rpt_reconciliation_exceptions
    description: >
      Where the latest Workday report and the seat plan disagree, one row per exception type per
      subject. The plan is the live plan in `app.seats` (as saved now, the seats `dim_people`
      shows), so a fix a leader saves clears the exception on the next build. Exception types:
      `terminated_seated` (error: in the latest report as terminated, still holds a seat);
      `seated_missing_from_report` (error: holds a seat but is not in the latest report, even if
      they aged out); `missing_without_termination` (warning: holds no seat, was in the previous
      report as active or on leave, and is missing now with no termination; a seated worker who
      drops off gets only `seated_missing_from_report`, so one problem is one row); `worker_type_mismatch` (error: worker type
      differs from seat type); `on_leave_seated` (info: on leave and holds a seat, which is
      allowed); `hiring_gap` (info: a group's `offer_accepted` seats outnumber its future-dated
      hires in the latest report, matched by cost center name because seats aren't linked to
      positions, D-029). Worker checks on status and type look only at workers in the latest
      report; a seated worker missing from it gets `seated_missing_from_report` instead.
      `missing_without_termination` compares only the latest report with the previous one, so an
      unseated worker who stays missing drops out of this report one report later (they are no
      longer in the previous report either). Revisit when a third report exists.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [exception_type, subject_id]
    columns:
      - name: exception_type
        description: Which check found the exception (see the model description).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "terminated_seated",
                    "seated_missing_from_report",
                    "missing_without_termination",
                    "worker_type_mismatch",
                    "on_leave_seated",
                    "hiring_gap",
                  ]
      - name: subject_id
        description: The worker ID, or the group ID (as text) for `hiring_gap`.
        data_tests: [not_null]
      - name: subject_type
        description: "`group` for `hiring_gap`, `worker` otherwise."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["worker", "group"]
      - name: severity
        description: "`error` (the plan is wrong), `warning` (the HRIS data needs a look) or `info` (worth knowing; no fix needed)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["error", "warning", "info"]
      - name: report_date
        description: The latest report date, the report the plan was compared with.
        data_tests: [not_null]
      - name: worker_id
        description: The worker; null for `hiring_gap`.
      - name: seat_id
        description: >
          The worker's seat in the saved plan (`app.seats` as saved now, which includes moves
          saved with a future effective date, so it can differ from the seat held today); null
          for `hiring_gap` and `missing_without_termination`.
      - name: squad_id
        description: That seat's squad.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_squads')
                field: squad_id
      - name: group_id
        description: The seat's group, or the group for `hiring_gap`; null when there is no seat.
      - name: detail
        description: What was found, in a sentence.
        data_tests: [not_null]
      - name: suggested_action
        description: What to do about it.
        data_tests: [not_null]
