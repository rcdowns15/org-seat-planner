# Local Postgres for development. Credentials are localhost-only defaults, not secrets.
# One shared project name so every worktree and the main checkout use the same container and volume.
name: org-seat-planner

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seatplanner
      POSTGRES_PASSWORD: seatplanner
      POSTGRES_DB: seatplanner
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatplanner -d seatplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
