name: db-deploy

# Manual only: applies migrations (and optionally reseeds) the Neon database.
on:
  workflow_dispatch:
    inputs:
      reseed:
        description: "Wipe and reseed app + workday after migrating"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # stop a hung job instead of waiting for the 6-hour default
    steps:
      # The secret reaches scripts only through the environment of the steps that need it:
      # never echoed, never an argument.
      - name: Fail if the secret is missing
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Secret NEON_DATABASE_URL_UNPOOLED is not set (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Plain install: the seed needs the dev dependency @faker-js/faker.
      - run: pnpm install --frozen-lockfile
      - name: Migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
        run: pnpm db:migrate
      - name: Reseed
        if: ${{ inputs.reseed }}
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
        run: pnpm db:seed --allow-remote
